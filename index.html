<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asia Countries & Flags — Drag and Drop</title>
<style>
:root { --bg:#f6f8fb; --card:#fff; --ink:#172033; --muted:#667085; --line:#cfd6e4; --target:#d8e6f7; --correct:#dff3e4; --accent:#2458a6; --wrong:#b42318; }
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.app{max-width:1280px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:28px} .sub{color:var(--muted);margin-top:4px} .score{font-size:22px;font-weight:700}
.board{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;align-items:start}
.bank,.map-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.section-title{font-size:14px;font-weight:700;margin:0 0 8px}
.pieces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.piece{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:7px;cursor:grab;font-size:16px;font-weight:700;user-select:none;touch-action:none}
.piece.flag svg{width:66px;height:44px;border:1px solid #aaa;display:block}
.piece.selected{outline:3px solid var(--accent);outline-offset:2px}
.piece.done{visibility:hidden}
.instructions{font-size:13px;color:var(--muted);line-height:1.4;margin:2px 0 0}
.map-wrap{position:relative;width:100%;overflow:hidden}
#map{display:block;width:100%;height:auto;background:#eef3f7;border-radius:12px}
.country{fill:#f8fafc;stroke:#8b98a9;stroke-width:1.1;vector-effect:non-scaling-stroke}
.country.target{fill:var(--target);stroke:#667085;stroke-width:1.4;cursor:pointer}
.country.target:hover{fill:#c7d9f0}
.placed-name{font-size:16px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.placed-flag{pointer-events:none}
#ghost{position:fixed;z-index:9999;pointer-events:none;display:none;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--accent);border-radius:10px;padding:6px 10px;box-shadow:0 8px 24px #0002;font-weight:700}
#ghost svg{width:66px;height:44px;display:block}
.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
#feedback{font-weight:700;min-height:22px} button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#f2f4f7}
@media(max-width:850px){.board{grid-template-columns:1fr}.pieces{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:560px){.pieces{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}}
</style>
</head>

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function key(type,name){return type+'|'+name}

function addPlaced(type,name){
 const d=DATA.find(x=>x.name===name), ns='http://www.w3.org/2000/svg';
 if(type==='name'){
   const t=document.createElementNS(ns,'text');t.setAttribute('x',d.x);t.setAttribute('y',d.y+25);t.setAttribute('text-anchor','middle');t.setAttribute('class','placed-name');t.textContent=name;t.dataset.key=key(type,name);placed.appendChild(t);
 } else {
   const fo=document.createElementNS(ns,'foreignObject');fo.setAttribute('x',d.x-35);fo.setAttribute('y',d.y-42);fo.setAttribute('width',70);fo.setAttribute('height',48);fo.setAttribute('class','placed-flag');fo.dataset.key=key(type,name);
   const div=document.createElement('div');div.style.width='66px';div.style.height='44px';div.innerHTML=FLAGS[name];div.querySelector('svg').style.cssText='width:66px;height:44px;border:1px solid #777;display:block';fo.appendChild(div);placed.appendChild(fo);
 }
}
map.addEventListener('click',e=>{const c=e.target.closest?.('.country.target');if(c&&selected)attempt(selected.type,selected.name,c.dataset.country)});
document.getElementById('restart').addEventListener('click',()=>{done=new Set();selected=null;placed.innerHTML='';score.textContent='0 / 16';feedback.textContent='';render()});
render();
</script>
</body></html>
